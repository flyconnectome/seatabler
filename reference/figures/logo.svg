<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1155" width="1000" height="1155">
  <defs>
    <!-- SeaTable's own orange-to-red gradient, taken from their logo SVG. -->
    <linearGradient id="stGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8000"/>
      <stop offset="1" stop-color="#ec2837"/>
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="500,0 1000,289 1000,866 500,1155 0,866 0,289"/>
    </clipPath>
  </defs>

  <!-- Hex body in SeaTable navy -->
  <polygon points="500,0 1000,289 1000,866 500,1155 0,866 0,289" fill="#001940"/>

  <!-- Gradient rim, drawn inside the clip so the stroke stays flush with the edge -->
  <g clip-path="url(#hexClip)">
    <polygon points="500,0 1000,289 1000,866 500,1155 0,866 0,289"
             fill="none" stroke="url(#stGrad)" stroke-width="56"/>
  </g>

  <!-- The SeaTable mark. Source paths span 0-352 x 0-494; scale to 300 wide
       and centre on (500, 455). -->
  <g transform="translate(363,190) scale(0.78)">
    <path fill="#ff8000" fill-rule="evenodd"
          d="M84.23,338.8l222.37-222.35L190.15,0,22.78,167.37c-30.37,30.37-30.37,79.61,0,109.98l61.45,61.45Z"/>
    <path fill="url(#stGrad)" fill-rule="evenodd"
          d="M45.53,377.5l116.44,116.44,167.37-167.37c30.37-30.37,30.37-79.61,0-109.98l-61.45-61.46-1.1-1.1-183.86,183.46,1.29,1.29-38.7,38.7Z"/>
  </g>

  <!-- Package name -->
  <text x="500" y="830" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="138" font-weight="600" fill="#ffffff"
        letter-spacing="2">seatabler</text>

  <!-- A nod to what the package is: a row of table cells -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7">
    <rect x="330" y="898" width="113" height="52" rx="6"/>
    <rect x="443" y="898" width="113" height="52" rx="6"/>
    <rect x="556" y="898" width="113" height="52" rx="6"/>
  </g>
</svg>
