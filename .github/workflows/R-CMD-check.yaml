# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Single-platform (Ubuntu) R CMD check, including the testthat suite. Python is
# provisioned through nat.python::simple_python() -- the same entry point end
# users are pointed at -- so CI exercises the real user-facing install path
# rather than a bespoke pip line.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Token for the live flytable testfruit test (test-flytable-live.R). When
      # the secret is unset the test skips itself, so forks without it still pass.
      FLYTABLE_TOKEN: ${{ secrets.FLYTABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pin to a version with stable seatable_api / pandas wheels (3.14 has
          # no pandas wheel yet, forcing a slow/failing source build).
          python-version: '3.12'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Provision Python packages via nat.python (the user-facing path)
        # The "minimal" bundle installs pandas (nat.python's baseline, needed by
        # pandas2df); pkgs adds seatable_api on top -- exactly what seatabler
        # needs, via the entry point end users are pointed at. Runs after
        # setup-r-dependencies so nat.python is installed.
        #
        # simple_python(miniconda = FALSE) installs into reticulate's managed
        # `r-reticulate` virtualenv, NOT an arbitrary RETICULATE_PYTHON. So leave
        # RETICULATE_PYTHON unset here, then pin it to that venv for the check
        # step -- otherwise the live tests run against a Python without
        # seatable_api and silently skip.
        shell: Rscript {0}
        run: |
          nat.python::simple_python("minimal", pkgs = "seatable_api",
                                    miniconda = FALSE)
          venv <- reticulate::virtualenv_python("r-reticulate")
          cat(sprintf("RETICULATE_PYTHON=%s\n", venv),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
