# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Single-platform (Ubuntu) R CMD check, including the testthat suite. Python and
# the seatable_api module are installed so reticulate-backed code can load.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Token for the live flytable testfruit test (test-flytable-live.R). When
      # the secret is unset the test skips itself, so forks without it still pass.
      FLYTABLE_TOKEN: ${{ secrets.FLYTABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pin to a version with stable seatable_api / pandas wheels (3.14 has
          # no pandas wheel yet, forcing a slow/failing source build).
          python-version: '3.12'

      - name: Install seatable_api and point reticulate at this Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # pandas is imported directly by seatable_query()/list_rows() and by
          # nat.python::pandas2df(); seatable_api does not pull it in, so the
          # live tests silently fail their queries without it.
          python -m pip install seatable_api pandas
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
